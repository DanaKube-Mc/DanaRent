# =============================================================
#           Configuration Générale - DanaRent
# =============================================================

database:
  file: "data.db"
  pool:
    maximum-pool-size: 5
    connection-timeout: 30000

# Activation modulaire des types de parcelles
types:
  farm:
    enabled: true
  mining:
    enabled: true

# Économie & Régulation financière
economy:
  currency-symbol: "⛀"
  tax:
    # Pourcentage prélevé sur les gains bruts du propriétaire (0.0 pour désactiver)
    percentage: 10.0
    # Mode Option A : Destruction pure de la monnaie (Money sink serveur)
    mode: "MONEY_SINK"

# Quotas de création et de location
limits:
  creation:
    # Nombre de parcelles maximales créées par défaut par île
    default: 3
  active-rentals:
    # Nombre maximal de baux qu'un locataire peut avoir actifs en même temps
    default: 1
  # Rétro-compatibilité
  default-plots-per-island: 3

settings:
  # Monnaie affichée dans les textes
  currency-symbol: "⛀"
  # Buffer de tolérance pour le confinement spatial en blocs
  boundary-buffer: 1.0
  # Particules affichées aux limites
  particles:
    warning-color: "#FFA500" # Orange lors de l'approche du buffer
    border-color: "#00FF00"  # Vert pour marquer le champ

wand:
  material: "GOLDEN_HOE"
  name: "<b><gradient:#F82F04:#FFEE2E>Baguette de Sélection</gradient></b>"
  lore:
    - "<#c0c0c0>Délimitez votre parcelle de location."
    - "<#55ff55>Clic gauche <#c0c0c0>: Définir le <#ffffff>Coin 1</#ffffff>"
    - "<#55ff55>Clic droit  <#c0c0c0>: Définir le <#ffffff>Coin 2</#ffffff>"
  custom-model-data: 0

