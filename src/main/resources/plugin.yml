name: DanaRent
version: '${project.version}'
main: net.danakube.danarent.DanaRentPlugin
api-version: '1.21'
author: Danakube
description: Plugin de location de parcelles agricoles et de minage pour Danakube
softdepend:
  - Vault
  - SuperiorSkyblock2

commands:
  farm:
    description: Commande principale pour gérer les parcelles de location
    permission: danarent.use
    aliases: [champs, location]

permissions:
  danarent.use:
    description: Permet d'accéder aux commandes DanaRent
    default: true
  danarent.owner:
    description: Permet de gérer ses parcelles et obtenir la baguette
    default: op
    children:
      danarent.use: true
  danarent.admin:
    description: Droits administrateur complets pour DanaRent
    default: op
    children:
      danarent.owner: true


